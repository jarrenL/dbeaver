model_sql_semantic_symbolClass_UNKNOWN = 未知符号
model_sql_semantic_symbolClass_QUOTED = 转义标识符
model_sql_semantic_symbolClass_RESERVED = 保留关键字
model_sql_semantic_symbolClass_STRING = 文本字符串
model_sql_semantic_symbolClass_CATALOG = 数据库目录
model_sql_semantic_symbolClass_SCHEMA = 模式
model_sql_semantic_symbolClass_TABLE = 表或视图
model_sql_semantic_symbolClass_OBJECT = 数据库对象
model_sql_semantic_symbolClass_FUNCTION = 函数或存储过程
model_sql_semantic_symbolClass_TABLE_ALIAS = 表或子查询别名
model_sql_semantic_symbolClass_COLUMN = 列
model_sql_semantic_symbolClass_COLUMN_DERIVED = 派生列
model_sql_semantic_symbolClass_COMPOSITE_FIELD = 复合字段
model_sql_semantic_symbolClass_SQL_BATCH_VARIABLE = 脚本变量
model_sql_semantic_symbolClass_DBEAVER_VARIABLE = 脚本变量
model_sql_semantic_symbolClass_DBEAVER_PARAMETER = SQL 语句参数
model_sql_semantic_symbolClass_DBEAVER_COMMAND = DBeaver 命令
model_sql_semantic_symbolClass_ERROR = 错误
model_sql_semantic_null_comparison = 与 NULL 直接比较通常得到 UNKNOWN。判断空值请使用 IS NULL 或 IS NOT NULL。
model_sql_semantic_select_star = SELECT * 的结果依赖表结构，建议显式列出查询列。
model_sql_semantic_insert_columns = INSERT 未显式列出目标列，请核对目标列、列顺序及默认值。
model_sql_semantic_order_ordinal = ORDER BY 使用了查询列序号，建议改用列名或别名。
model_sql_semantic_like_prefix = LIKE 模式以通配符开头，可能无法高效利用前缀索引，请核对匹配模式和执行计划。
model_sql_semantic_case_duplicate = CASE 中的 WHEN 表达式重复，请核对分支意图；重复求值仍可能得到不同结果。
model_sql_semantic_comparison_duplicate = 比较两侧的表达式文本相同，请核对操作数；这不代表结果必然为常量。
model_sql_semantic_exists_without_where = EXISTS 中包含没有自身 WHERE 条件的 SELECT，请确认是否需要无筛选条件的存在性判断。
