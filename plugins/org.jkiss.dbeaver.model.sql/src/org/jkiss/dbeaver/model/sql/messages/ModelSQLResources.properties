
## Symbol kind descriptions ##
model_sql_semantic_case_duplicate = CASE has a repeated WHEN expression. Check whether this branch was intended; repeated evaluation may still differ.
model_sql_semantic_comparison_duplicate = Comparison has identical expression text on both sides. Check the intended operands; this is not a proof of a constant result.
model_sql_semantic_exists_without_where = EXISTS contains a SELECT without its own WHERE clause. Review whether an unfiltered existence test is intended.
model_sql_semantic_not_in_null = NOT IN includes an explicit NULL candidate. If returned, NULL can make a non-matching comparison UNKNOWN rather than TRUE; review the intended filtering.
model_sql_semantic_like_prefix = LIKE pattern starts with a wildcard. This may prevent efficient use of a prefix index; review the pattern and execution plan.
model_sql_semantic_select_star = SELECT * couples the result to the table structure. Consider listing columns explicitly.
model_sql_semantic_insert_columns = INSERT has no explicit target-column list. Review the target columns, column order and defaults.
model_sql_semantic_order_ordinal = ORDER BY uses a select-list position. Consider using a column name or alias instead.
model_sql_semantic_null_comparison = Direct comparison with NULL normally evaluates to UNKNOWN. Use IS NULL or IS NOT NULL to test for null values.

